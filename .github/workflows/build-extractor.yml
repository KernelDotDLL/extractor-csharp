name: build-extractor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Fetch Recast/Detour
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/recastnavigation/recastnavigation.git "$env:RUNNER_TEMP\recastnavigation"

      - name: Build native RecastBuilderDll
        shell: pwsh
        run: |
          msbuild native\RecastBuilderDll\RecastBuilderDll.vcxproj /m `
            /p:Configuration=Release /p:Platform=x64 `
            /p:PlatformToolset=v143 `
            /p:RecastRoot="$env:RUNNER_TEMP\recastnavigation"

      - name: Fetch and build StormLib
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/ladislav-zezula/StormLib.git "$env:RUNNER_TEMP\StormLib"
          cmake -S "$env:RUNNER_TEMP\StormLib" -B "$env:RUNNER_TEMP\StormLib\build" -A x64 -DBUILD_SHARED_LIBS=ON
          cmake --build "$env:RUNNER_TEMP\StormLib\build" --config Release
          Get-ChildItem "$env:RUNNER_TEMP\StormLib" -Recurse -Filter *.dll |
            Select-Object -ExpandProperty FullName

      - name: Put StormLib next to the project
        shell: pwsh
        run: |
          $dll = Get-ChildItem "$env:RUNNER_TEMP\StormLib" -Recurse -Filter StormLib.dll |
                 Select-Object -First 1
          if (-not $dll) {
            $dll = Get-ChildItem "$env:RUNNER_TEMP\StormLib" -Recurse -Filter storm.dll |
                   Select-Object -First 1
          }
          if (-not $dll) { throw "StormLib DLL was not produced" }
          Copy-Item $dll.FullName .\StormLib.dll -Force

      - name: Build extractor
        shell: pwsh
        run: |
          dotnet build src\MaNGOS.Extractor.csproj -c Release -p:Platform=x64 `
            -p:StartupObject=MaNGOS.Extractor.CLI.Program

      - name: Publish self-contained win-x64
        shell: pwsh
        run: |
          dotnet publish src\MaNGOS.Extractor.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false -p:Platform=x64 `
            -p:StartupObject=MaNGOS.Extractor.CLI.Program -o publish

      - name: Add native DLLs to publish
        shell: pwsh
        run: |
          Copy-Item native\RecastBuilderDll\bin\Release\RecastBuilderDll.dll publish\ -Force
          Copy-Item .\StormLib.dll publish\ -Force
          Get-ChildItem publish | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extractor-win-x64
          path: publish
